version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Guncellemeler entegrasyon dalina duser, main'e degil.
    target-branch: test
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next']
      radix:
        patterns: ['@radix-ui/*']
      types:
        patterns: ['@types/*']
      lint:
        patterns: ['eslint*', '@typescript-eslint/*', 'prettier*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: test
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: test
    open-pull-requests-limit: 3
