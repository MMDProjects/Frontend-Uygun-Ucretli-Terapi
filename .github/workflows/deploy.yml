name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Ust uste gelen deploy'lari sirala; devam edeni ASLA iptal etme.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          proxy_timeout: 60s
          script: |
            set -e

            REPO_DIR=/home/cagri/frontend

            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/MMDProjects/frontend-Uygun-Ucretli-Terapi.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            docker compose up --build -d

            # Konteyner gercekten ayaga kalkti mi? Kalkmadiysa job kirmizi olur,
            # calisan konteynerlere dokunulmaz.
            curl -fsS --retry 20 --retry-delay 5 --retry-connrefused http://127.0.0.1:3000/ > /dev/null

            echo "Frontend deploy tamamlandi ve ana sayfa yanit veriyor"
