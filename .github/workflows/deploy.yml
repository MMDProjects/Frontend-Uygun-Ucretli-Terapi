name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Ust uste gelen deploy'lari sirala; devam edeni ASLA iptal etme.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          proxy_timeout: 60s
          script: |
            set -e

            REPO_DIR=/home/cagri/frontend

            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/MMDProjects/frontend-Uygun-Ucretli-Terapi.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            docker compose up --build -d

            # Konteyner gercekten ayaga kalkti mi? Kalkmadiysa job kirmizi olur,
            # calisan konteynerlere dokunulmaz.
            #
            # --retry-all-errors sart: Docker portu konteyner baslar baslamaz
            # acar, ama uygulama henuz dinlemiyorken baglanti "refused" degil
            # "reset by peer" (curl 56) doner. --retry-connrefused bu hatayi
            # kapsamaz ve kontrol hic beklemeden duser (2026-08-26 yanlis alarm).
            curl -fsS --retry 30 --retry-delay 5 --retry-all-errors http://127.0.0.1:3000/ > /dev/null

            echo "Frontend deploy tamamlandi ve ana sayfa yanit veriyor"
