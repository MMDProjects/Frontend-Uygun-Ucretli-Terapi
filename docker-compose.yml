services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://www.uygunucretliterapi.com/api}
    container_name: psiko_frontend
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://host.docker.internal:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
